<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub - Prenota un servizio per il tuo animale.">
    <title>PetSitterHub — Prenota Servizio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css?v=1">
</head>

<body class="d-flex flex-column min-vh-100" id="booking-page">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-icon">
                    <i class="bi bi-patch-check-fill"></i>
                </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-green rounded-pill px-4">
                    Torna alla Home
                </a>
                <a href="profilo.html" class="btn btn-outline-green rounded-pill px-3">
                    Profilo
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- MAIN SECTION -->
<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Card Riepilogo e Form Prenotazione -->
                <div class="login-card mb-4">
                    <div class="text-center mb-4">
                        <span class="hero-eyebrow mb-2">
                            <i class="bi bi-calendar-event"></i> Nuova Prenotazione
                        </span>
                        <h1 class="h2 font-weight-bold mt-2">Richiedi un Servizio</h1>
                        <p class="text-muted">Seleziona le date e conferma i dettagli per prenotare il tuo pet-sitter.</p>
                    </div>

                    <!-- Form Prenotazione -->
                    <form id="booking-form" novalidate>

                        <!-- Selezione Servizio / Sitter -->
                        <div class="mb-4">
                            <label for="booking-servizio" class="form-label fw-semibold">Servizio Selezionato</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-heart-pulse"></i>
                                </span>
                                <select id="booking-servizio" class="form-select" required>
                                    <option value="" disabled selected>Caricamento servizi disponibili...</option>
                                </select>
                            </div>
                        </div>

                        <!-- Date Inizio e Fine -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="data-inizio" class="form-label fw-semibold">Data e Ora Inizio</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-calendar-plus"></i>
                                    </span>
                                    <input type="datetime-local" id="data-inizio" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="data-fine" class="form-label fw-semibold">Data e Ora Fine</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-calendar-check"></i>
                                    </span>
                                    <input type="datetime-local" id="data-fine" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <!-- Campo Note Aggiuntive -->
                        <div class="mb-4">
                            <label for="booking-note" class="form-label fw-semibold">Note o Richieste Speciali (Opzionale)</label>
                            <textarea id="booking-note" class="form-control" rows="3" placeholder="Es. Dettagli sul carattere dell'animale o istruzioni speciali..."></textarea>
                        </div>

                        <!-- Bottone di Invio Prenotazione -->
                        <button type="submit" class="btn btn-coral w-100 py-2 mb-3">
                            <i class="bi bi-credit-card me-1"></i> Conferma e Procedi al Pagamento
                        </button>

                        <!-- Messaggio di esito -->
                        <p id="booking-status" class="search-status text-center mb-0" aria-live="polite"></p>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script Logica Prenotazione AJAX -->
<script>
    $(document).ready(function () {
        const token = localStorage.getItem('token');

        // 1. Controllo Autenticazione: Se non c'è il token, reindirizza al Login
        if (!token) {
            window.location.href = "login.html";
            return;
        }

        // Configura il Token Authorization per tutte le chiamate AJAX
        $.ajaxSetup({
            headers: {
                'Authorization': 'Bearer ' + token
            }
        });

        // 2. Caricamento dinamico dei servizi
        $.ajax({
            url: "/api/servizi",
            method: "GET",
            success: function (servizi) {
                const $select = $("#booking-servizio");
                $select.empty().append('<option value="" disabled selected>Scegli un servizio...</option>');

                servizi.forEach(function (s) {
                    $select.append(`
                        <option value="${s.id}">
                            ${s.tipologia} - ${s.tipo_animale} (€${s.tariffa} in ${s.zona})
                        </option>
                    `);
                });
            },
            error: function () {
                $("#booking-servizio").html('<option value="">Errore nel caricamento dei servizi</option>');
            }
        });

        // 3. Gestione Submit Form
        $("#booking-form").on("submit", function (e) {
            e.preventDefault();

            const dataInizio = $("#data-inizio").val();
            const dataFine = $("#data-fine").val();
            const idServizio = $("#booking-servizio").val();
            const note = $("#booking-note").val() ? $("#booking-note").val().trim() : "";

            const $status = $("#booking-status");

            if (!idServizio || !dataInizio || !dataFine) {
                $status.text("Compila tutti i campi obbligatori.").css("color", "#d95e40");
                return;
            }

            if (new Date(dataFine) <= new Date(dataInizio)) {
                $status.text("La data di fine deve essere successiva alla data di inizio.").css("color", "#d95e40");
                return;
            }

            const bookingData = {
                id_servizio: parseInt(idServizio),
                data_inizio: dataInizio,
                data_fine: dataFine,
                note: note
            };

            $status.text("Invio richiesta in corso...").css("color", "green");

            // Invio Dati al Backend
            $.ajax({
                url: "/api/prenotazioni",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(bookingData),
                success: function (response) {
                    $status.text("Prenotazione registrata! Reindirizzamento al pagamento...").css("color", "green");

                    // Reindirizza alla pagina di pagamento passandogli l'ID della prenotazione creata
                    setTimeout(function() {
                        window.location.href = `pagamento.html?booking_id=${response.id || ''}`;
                    }, 1200);
                },
                error: function (xhr) {
                    const errorMsg = xhr.responseJSON?.message || "Errore durante l'invio della prenotazione.";
                    $status.text(errorMsg).css("color", "#d95e40");
                }
            });
        });
    });
</script>

</body>
</html>
