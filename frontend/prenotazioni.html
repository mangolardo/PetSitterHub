<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub - Prenota un servizio per il tuo animale.">
    <title>PetSitterHub — Prenota Servizio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css?v=1">
</head>

<body class="d-flex flex-column min-vh-100" id="booking-page">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-icon">
                    <i class="bi bi-patch-check-fill"></i>
                </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-green rounded-pill px-4">
                    Torna alla Home
                </a>
                <a href="profilo.html" class="btn btn-outline-green rounded-pill px-3">
                    Profilo
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- MAIN SECTION -->
<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Card Riepilogo e Form Prenotazione -->
                <div class="login-card mb-4">
                    <div class="text-center mb-4">
                        <span class="hero-eyebrow mb-2">
                            <i class="bi bi-calendar-event"></i> Nuova Prenotazione
                        </span>
                        <h1 class="h2 font-weight-bold mt-2">Richiedi un Servizio</h1>
                        <p class="text-muted">Seleziona le date e conferma i dettagli per prenotare il tuo pet-sitter.</p>
                    </div>

                    <!-- Form Prenotazione -->
                    <form id="booking-form" novalidate>

                        <!-- Selezione Servizio / Sitter -->
                        <div class="mb-4">
                            <label for="booking-servizio" class="form-label fw-semibold">Servizio Selezionato</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-heart-pulse"></i>
                                </span>
                                <select id="booking-servizio" class="form-select" required>
                                    <option value="" disabled selected>Caricamento servizi disponibili...</option>
                                    <!-- Ipotetici dati popolati via AJAX o passati come parametro URL -->
                                </select>
                            </div>
                        </div>

                        <!-- Date Inizio e Fine (Rispetta i vincoli TIMESTAMP e CHECK del DB) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="data-inizio" class="form-label fw-semibold">Data e Ora Inizio</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-calendar-plus"></i>
                                    </span>
                                    <input type="datetime-local" id="data-inizio" class="form-control" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="data-fine" class="form-label fw-semibold">Data e Ora Fine</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-calendar-check"></i>
                                    </span>
                                    <input type="datetime-local" id="data-fine" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <!-- Note aggiuntive per la prenotazione -->
                        <div class="mb-4">
                            <label for="booking-note" class="form-label fw-semibold">Note per il Pet Sitter (Opzionale)</label>
                            <textarea id="booking-note" class="form-control" rows="3" placeholder="Es. Informazioni sul carattere dell'animale, orari pappa, esigenze particolari..."></textarea>
                        </div>

                        <!-- Bottoni Azione -->
                        <button type="submit" class="btn btn-coral w-100 py-2 mb-3">
                            <a href="pagamento.html" class="bi bi-send me-1">Passa al Pagamento</a>
                        </button>

                        <!-- Messaggio di esito -->
                        <p id="booking-status" class="search-status text-center mb-0" aria-live="polite"></p>
                    </form>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Logica AJAX per Autenticazione e Prenotazione -->
<script src="js/auth.js"></script>
</body>

</html>
