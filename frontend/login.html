<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub - Accedi al tuo account.">
    <title>PetSitterHub — Accedi</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <span class="brand-icon">
                        <i class="bi bi-patch-check-fill"></i>
                    </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-green rounded-pill px-4">
                    Torna alla Home
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- LOGIN MAIN SECTION -->
<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <div class="login-card">
                    <div class="text-center mb-4">
        <span class="hero-eyebrow mb-2">
            <i class="bi bi-person-lock"></i> Area Riservata
        </span>
                        <h1 class="h2 font-weight-bold mt-2">Bentornato!</h1>
                        <p class="text-muted">Inserisci le tue credenziali per accedere</p>
                    </div>

                    <!-- Elemento Alert per i messaggi di errore/successo -->
                    <div id="alertMessage" class="alert d-none text-center" role="alert"></div>

                    <!-- Form di Login (ID aggiornato in loginForm) -->
                    <form id="loginForm" novalidate>

                        <!-- Email (ID aggiornato in loginEmail) -->
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-semibold">Indirizzo Email</label>
                            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>
                                <input type="email" id="loginEmail" class="form-control" placeholder="nome@esempio.it" required>
                            </div>
                        </div>

                        <!-- Password (ID aggiornato in loginPassword) -->
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <!-- Testo di aiuto sotto al campo -->
                            <div class="form-text text-muted">
                                La password deve contenere almeno una maiuscola, un numero e un carattere speciale.
                            </div>
                        </div>

                        <!-- Bottone di Login -->
                        <button type="submit" class="btn btn-coral w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Accedi
                        </button>
                    </form>
                </div>

                <!-- Link Registrazione -->
                <div class="text-center mt-4">
                    <p class="text-muted">Non hai ancora un account? <a href="registrazione.html" class="fw-bold color-green text-decoration-none">Registrati subito</a></p>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/auth.js"></script>
<!-- Script jQuery Gestione Form -->
<script>
    $(document).ready(function () {
        // 1. Toggle mostra/nascondi password
        $("#toggle-password").on("click", function () {
            const $input = $("#loginPassword");
            const $icon = $(this).find("i");
            const isPassword = $input.attr("type") === "password";

            $input.attr("type", isPassword ? "text" : "password");
            $icon.toggleClass("bi-eye bi-eye-slash");
        });

        // Regex per i requisiti della password:
        // (?=.*[A-Z]) -> almeno una maiuscola
        // (?=.*\d)     -> almeno un numero
        // (?=.*[\W_])  -> almeno un carattere speciale (es. !@#$%^&*)
        const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[\W_])/;

        // 2. Gestione Submit del Form con Validazione
        $("#loginForm").on("submit", function (e) {
            const password = $("#loginPassword").val();
            const $alert = $("#alertMessage");

            // Reset stato alert
            $alert.addClass("d-none").removeClass("alert-danger alert-success").text("");

            // Controllo requisiti password
            if (!passwordRegex.test(password)) {
                e.preventDefault(); // Blocca l'invio del form

                $alert
                    .removeClass("d-none")
                    .addClass("alert-danger")
                    .html("La password deve contenere almeno <strong>una lettera maiuscola</strong>, <strong>un numero</strong> e <strong>un carattere speciale</strong>.");

                $("#loginPassword").addClass("is-invalid").focus();
                return false;
            }

            $("#loginPassword").removeClass("is-invalid");

            // Se la validazione passa, il submit continua normalmente
            // oppure viene intercettato dalla tua logica AJAX in js/auth.js
        });

        // 3. Rimuove lo stato di errore quando l'utente ricomincia a digitare
        $("#loginPassword").on("input", function () {
            $(this).removeClass("is-invalid");
            $("#alertMessage").addClass("d-none");
        });
    });
</script>
</body>

</html>
