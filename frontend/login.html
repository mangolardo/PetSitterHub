<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub - Accedi al tuo account.">
    <title>PetSitterHub — Accedi</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css?">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <span class="brand-icon">
                        <i class="bi bi-patch-check-fill"></i>
                    </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-green rounded-pill px-4">
                    Torna alla Home
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- LOGIN MAIN SECTION -->
<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">

                <div class="login-card">
                    <div class="text-center mb-4">
                            <span class="hero-eyebrow mb-2">
                                <i class="bi bi-person-lock"></i> Area Riservata
                            </span>
                        <h1 class="h2 font-weight-bold mt-2">Bentornato!</h1>
                        <p class="text-muted">Inserisci le tue credenziali per accedere</p>
                    </div>

                    <!-- Form di Login -->
                    <form id="login-form" novalidate>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="login-email" class="form-label fw-semibold">Indirizzo Email</label>
                            <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                <input type="email" id="login-email" class="form-control" placeholder="nome@esempio.it" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="login-password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Ricordami & Password Dimenticata -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember-me">
                                <label class="form-check-label small" for="remember-me">
                                    Ricordami
                                </label>
                            </div>
                            <a href="#" class="small text-decoration-none color-coral">Password dimenticata?</a>
                        </div>

                        <!-- Bottone di Login -->
                        <button type="submit" class="btn btn-coral w-100 py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Accedi
                        </button>

                        <!-- Messaggio di esito -->
                        <p id="login-status" class="search-status text-center mb-0" aria-live="polite"></p>

                    </form>
                </div>

                <!-- Link Registrazione -->
                <div class="text-center mt-4">
                    <p class="text-muted">Non hai ancora un account? <a href="#" class="fw-bold color-green text-decoration-none">Registrati subito</a></p>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script jQuery Gestione Form -->
<script>
    $(document).ready(function () {
        // Toggle mostra/nascondi password
        $("#toggle-password").on("click", function () {
            const $input = $("#login-password");
            const $icon = $(this).find("i");
            const isPassword = $input.attr("type") === "password";

            $input.attr("type", isPassword ? "text" : "password");
            $icon.toggleClass("bi-eye bi-eye-slash");
        });

        // Gestione Invio Form Login
        $("#login-form").on("submit", function (e) {
            e.preventDefault();

            const email = $("#login-email").val().trim();
            const password = $("#login-password").val().trim();
            const $status = $("#login-status");

            if (!email || !password) {
                $status.css("color", "#d95e40").text("Compila tutti i campi richiesti.");
                return;
            }

            $status.css("color", "var(--green)").text("Accesso in corso...");

            // Esempio chiamata AJAX verso Express
            $.ajax({
                url: "/api/login",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ email: email, password: password }),
                success: function (res) {
                    $status.css("color", "var(--green)").text("Accesso effettuato! Reindirizzamento...");
                    setTimeout(function () {
                        window.location.href = "index.html";
                    }, 1000);
                },
                error: function () {
                    $status.css("color", "#d95e40").text("Credenziali non valide o errore di connessione.");
                }
            });
        });
    });
</script>
</body>

</html>
