<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub - Crea il tuo account.">
    <title>PetSitterHub — Registrazione</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css?v=1">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-icon">
                    <i class="bi bi-patch-check-fill"></i>
                </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-green rounded-pill px-4">
                    Torna alla Home
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- REGISTER MAIN SECTION -->
<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-7">

                <div class="login-card">
                    <div class="text-center mb-4">
                        <span class="hero-eyebrow mb-2">
                            <i class="bi bi-person-plus"></i> Unisciti a noi
                        </span>
                        <h1 class="h2 font-weight-bold mt-2">Crea un account</h1>
                        <p class="text-muted">Inserisci i tuoi dati per registrarti su PetSitterHub</p>
                    </div>

                    <!-- Form di Registrazione -->
                    <form id="register-form" novalidate>

                        <!-- Selezione Ruolo -->
                        <div class="mb-4">
                            <label for="reg-ruolo" class="form-label fw-semibold">Vorrei registrari come:</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person-badge"></i>
                                </span>
                                <select id="reg-ruolo" class="form-select" required>
                                    <option value="proprietario" selected>Proprietario di un animale</option>
                                    <option value="professionista">Pet Sitter / Professionista</option>
                                </select>
                            </div>
                        </div>

                        <!-- Nome e Cognome -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reg-nome" class="form-label fw-semibold">Nome</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" id="reg-nome" class="form-control" placeholder="Mario" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="reg-cognome" class="form-label fw-semibold">Cognome</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input type="text" id="reg-cognome" class="form-control" placeholder="Rossi" required>
                                </div>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="reg-email" class="form-label fw-semibold">Indirizzo Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" id="reg-email" class="form-control" placeholder="nome@esempio.it" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="reg-password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#reg-password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Zona (Mostrata solo per i Proprietari via DB) -->
                        <div class="mb-4" id="zona-wrapper">
                            <label for="reg-zona" class="form-label fw-semibold">Zona / Città</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-geo-alt"></i>
                                </span>
                                <input type="text" id="reg-zona" class="form-control" placeholder="Es. Milano Centro">
                            </div>
                        </div>

                        <!-- Bottone di Registrazione -->
                        <button type="submit" class="btn btn-coral w-100 py-2 mb-3">
                            <i class="bi bi-check-circle me-1"></i> Registrati
                        </button>

                        <!-- Messaggio di esito -->
                        <p id="register-status" class="search-status text-center mb-0" aria-live="polite"></p>

                    </form>
                </div>

                <!-- Link Login -->
                <div class="text-center mt-4">
                    <p class="text-muted">Hai già un account? <a href="login.html" class="fw-bold color-green text-decoration-none">Accedi qui</a></p>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0">© 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Logica AJAX (Interazione con Express.js API) -->
<script src="js/auth.js"></script>

<!-- Script UI (Mostra/Nascondi password e campi dinamici) -->
<script>
    $(document).ready(function () {
        // Toggle mostra/nascondi password
        $(".toggle-password").on("click", function () {
            const targetId = $(this).data("target");
            const $input = $(targetId);
            const $icon = $(this).find("i");
            const isPassword = $input.attr("type") === "password";

            $input.attr("type", isPassword ? "text" : "password");
            $icon.toggleClass("bi-eye bi-eye-slash");
        });

        // Gestione visibilità campo Zona in base al ruolo selezionato
        $("#reg-ruolo").on("change", function () {
            if ($(this).val() === "professionista") {
                $("#zona-wrapper").hide();
            } else {
                $("#zona-wrapper").show();
            }
        });
    });
</script>
</body>

</html>
