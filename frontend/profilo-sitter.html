<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub — Profilo Pubblico del Pet Sitter">
    <title>PetSitterHub — Profilo Pet Sitter</title>

    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column min-vh-100">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <span class="brand-icon">
                    <i class="bi bi-patch-check-fill"></i>
                </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto">
                <a href="catalogo.html" class="btn btn-outline-green rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1"></i> Torna al Catalogo
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- MAIN CONTENT -->
<main class="flex-grow-1 py-5">
    <div class="container">

        <!-- Spinner di caricamento -->
        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Caricamento...</span>
            </div>
            <p class="text-muted mt-2">Caricamento profilo pet-sitter...</p>
        </div>

        <!-- Contenuto del Profilo (Nascosto finché i dati non sono caricati) -->
        <div id="sitterProfileContent" class="d-none">

            <!-- SCHEDA INTESTAZIONE SITTER -->
            <div class="dash-card p-4 p-md-5 mb-4 position-relative overflow-hidden">
                <div class="row align-items-center g-4">
                    <div class="col">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                            <h1 class="h2 font-weight-bold mb-0" id="sitterFullName">Nome Pet Sitter</h1>
                            <span class="verified-badge">
            <i class="bi bi-shield-check"></i> Verificato
        </span>
        <span class="text-muted small">
            <i class="bi bi-calendar-event me-1"></i>Membro dal: <strong id="sitterDataRegistrazione">-</strong>
        </span>
                        </div>
                    </div>
                      <div class="col-12 col-md-auto text-md-end">
                        <div class="rating d-inline-block px-3 py-2 shadow-sm">
                            <i class="bi bi-star-fill text-warning me-1 fs-5"></i>
                            <strong class="fs-4" id="sitterRatingMedia">-</strong>
                            <span class="text-muted small ms-1" id="sitterReviewsTotal">(0 recensioni)</span>
                        </div>
                          <div class="mt-3">
                              <button id="btn-start-chat" class="btn btn-coral rounded-pill px-4 shadow-sm">
                                  <i class="bi bi-chat-dots me-1"></i> Contatta
                              </button>
                          </div>
                    </div>

                </div>
                       </div>

            <div class="row g-4">

                <!-- COLONNA SINISTRA: SERVIZI OFFERTI -->
                <div class="col-12 col-lg-7">
                    <div class="dash-card p-4 mb-4">
                        <h3 class="h5 font-weight-bold mb-3 color-green">
                            <i class="bi bi-briefcase me-2"></i>Servizi Offerti
                        </h3>
                        <div id="servicesList" class="row g-3">
                            <!-- Inseriti dinamicamente via JS -->
                        </div>
                    </div>
                </div>

                <!-- COLONNA DESTRA: LISTA RECENSIONI -->
                <div class="col-12 col-lg-5">
                    <div class="dash-card p-4">
                        <h3 class="h5 font-weight-bold mb-3 color-green">
                            <i class="bi bi-chat-left-heart me-2"></i>Recensioni dei clienti
                        </h3>
                        <div id="sitterReviewsList" class="d-flex flex-column gap-3">
                            <!-- Inseriti dinamicamente via JS -->
                        </div>
                    </div>
                </div>

            </div>

            </div> <!-- Fine row -->

        </div> <!-- Fine profileContent -->

    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/profilo-sitter.js"></script>

</body>
</html>
