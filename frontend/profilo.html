<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PetSitterHub - Gestisci il tuo profilo utente.">
    <title>PetSitterHub — Profilo Utente</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS personalizzato -->
    <link rel="stylesheet" href="css/style.css?v=1">
</head>

<body class="d-flex flex-column min-vh-100" id="profile-page">

<!-- HEADER -->
<header class="site-header sticky-top">
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <span class="brand-icon">
                        <i class="bi bi-patch-check-fill"></i>
                    </span>
                <span>PetSitterHub</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-green rounded-pill px-4">
                    Torna alla Home
                </a>
                <button id="btnLogout" class="btn btn-coral rounded-pill px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Esci
                </button>
            </div>
        </div>
    </nav>
</header>

<!-- PROFILE MAIN SECTION -->
<main class="flex-grow-1 py-5">
    <div class="container">

        <div class="row justify-content-center g-4">
            <!-- SIDEBAR DI NAVIGAZIONE -->
            <div class="col-lg-3">
                <div class="list-group list-group-custom" id="dashboard-tabs" role="tablist">
                    <button class="list-group-item list-group-item-action active" id="tab-dati-btn" data-bs-toggle="list" data-bs-target="#tab-dati" type="button">
                        <i class="bi bi-person-vcard me-2"></i> Dati Account
                    </button>
                    <button class="list-group-item list-group-item-action" id="tab-servizi-btn" data-bs-toggle="list" data-bs-target="#tab-servizi" type="button">
                        <i class="bi bi-journal-text me-2"></i> Chat
                    </button>
                    <button class="list-group-item list-group-item-action" id="tab-prenotazioni-btn" data-bs-toggle="list" data-bs-target="#tab-prenotazioni" type="button">
                        <i class="bi bi-calendar-check me-2"></i> Prenotazioni
                    </button>
                    <button class="list-group-item list-group-item-action" id="tab-password-btn" data-bs-toggle="list" data-bs-target="#tab-password" type="button">
                        <i class="bi bi-shield-lock me-2"></i> Modifica password
                    </button>
                </div>
            </div>

            <!-- CONTENUTO DELLE SCHEDE -->
            <div class="col-lg-9">
                <div class="tab-content">

                    <!-- TAB 1: DATI ACCOUNT -->
                    <div class="tab-pane fade show active" id="tab-dati" role="tabpanel">
                        <div class="login-card">
                            <div class="mb-4">
                                    <span class="hero-eyebrow mb-2">
                                        <i class="bi bi-person-vcard"></i> Dati Account
                                    </span>
                                <h2 class="h4 font-weight-bold mt-2">Informazioni Personali</h2>
                            </div>

                            <form id="profile-form" novalidate>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="profile-nome-input" class="form-label fw-semibold">Nome</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" id="profile-nome-input" class="form-control" readonly>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="profile-cognome-input" class="form-label fw-semibold">Cognome</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                                            <input type="text" id="profile-cognome-input" class="form-control" readonly>
                                        </div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="profile-email-input" class="form-label fw-semibold">Indirizzo Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="profile-email-input" class="form-control" readonly>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="profile-zona-input" class="form-label fw-semibold">Zona Registrata</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                        <input type="text" id="profile-zona-input" class="form-control" placeholder="Non specificata" readonly>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- TAB 2: MESSAGGI -->
                    <div class="tab-pane fade" id="tab-servizi" role="tabpanel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="h4 fw-bold mb-0">Chat</h3>
                        </div>
                        <!-- Contenuto messaggi qui -->
                    </div>

                    <!-- TAB 3: PRENOTAZIONI -->
                    <div class="tab-pane fade" id="tab-prenotazioni" role="tabpanel">
                        <h3 class="h4 fw-bold mb-3">Prenotazioni</h3>
                        <div class="dash-card p-4">
                            <div class="table-responsive">
                                <table class="table align-middle mb-0">
                                    <thead>
                                    <tr class="text-muted border-bottom">
                                        <th>Servizio</th>
                                        <th>Data Inizio</th>
                                        <th>Data Fine</th>
                                        <th>Pet-sitter</th>
                                        <th>Importo</th>
                                    </tr>
                                    </thead>
                                    <tbody id="lista-prenotazioni">
                                    <tr>
                                        <td colspan="5" class="text-center py-4 text-muted">Caricamento prenotazioni...</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 4: MODIFICA PASSWORD -->
                    <div class="tab-pane fade" id="tab-password" role="tabpanel">
                        <div class="login-card">
                            <div class="mb-4">
                                    <span class="hero-eyebrow mb-2">
                                        <i class="bi bi-shield-lock"></i> Sicurezza
                                    </span>
                                <h2 class="h4 font-weight-bold mt-2">Aggiorna Password</h2>
                            </div>

                            <form id="update-password-form" novalidate>
                                <!-- Vecchia Password -->
                                <div class="mb-3">
                                    <label for="old-password" class="form-label fw-semibold">Password Attuale</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="old-password" class="form-control" placeholder="••••••••" required>
                                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#old-password">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Nuova Password -->
                                <div class="mb-4">
                                    <label for="new-password" class="form-label fw-semibold">Nuova Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                                        <input type="password" id="new-password" class="form-control" placeholder="••••••••" required>
                                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#new-password">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Bottone Salva -->
                                <button type="submit" class="btn btn-coral w-100 py-2 mb-3">
                                    <i class="bi bi-save me-1"></i> Cambia Password
                                </button>

                                <!-- Messaggio di esito -->
                                <p id="password-status" class="search-status text-center mb-0" aria-live="polite"></p>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="site-footer mt-auto py-3">
    <div class="container text-center">
        <p class="mb-0">© 2026 PetSitterHub. Tutti i diritti riservati.</p>
    </div>
</footer>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Logica AJAX -->
<script src="js/auth.js"></script>

<!-- Script UI -->
<script>
    $(document).ready(function () {
        $(".toggle-password").on("click", function () {
            const targetId = $(this).data("target");
            const $input = $(targetId);
            const $icon = $(this).find("i");
            const isPassword = $input.attr("type") === "password";

            $input.attr("type", isPassword ? "text" : "password");
            $icon.toggleClass("bi-eye bi-eye-slash");
        });
    });
</script>
</body>

</html>
